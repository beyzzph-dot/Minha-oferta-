<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Tiger - Interface</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(180deg, #b91c1c 0%, #7f1d1d 100%);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 text-white font-sans">

    <!-- Container Principal -->
    <div class="w-full max-w-md bg-stone-900/95 border border-amber-500/30 rounded-2xl p-6 shadow-2xl relative overflow-hidden backdrop-blur-sm">
        
        <!-- Elementos Decorativos de Fundo -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/10 rounded-full blur-xl"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-red-500/10 rounded-full blur-xl"></div>

        <!-- Cabeçalho / Logo Simulado -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500 drop-shadow-md italic uppercase">
                Fortune <br><span class="text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">Tiger</span>
            </h1>
        </div>

        <!-- Seção de Cadastro -->
        <div class="space-y-5">
            <div class="text-center">
                <h2 class="text-xl font-bold text-amber-400 tracking-wide uppercase">Criar Conta</h2>
                <p class="text-xs text-stone-400 mt-1">Registe-se e ative as 10 jogadas grátis</p>
            </div>

            <!-- Formulário -->
            <form class="space-y-4" onsubmit="event.preventDefault();">
                <div>
                    <label class="block text-xs font-semibold text-stone-400 uppercase tracking-wider mb-1.5">Nome completo</label>
                    <input type="text" placeholder="Introduza o seu nome" 
                           class="w-full bg-stone-800/80 border border-stone-700 rounded-xl px-4 py-3 text-sm text-white placeholder-stone-500 focus:outline-none focus:border-amber-500 transition-colors">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-400 uppercase tracking-wider mb-1.5">Telemóvel</label>
                    <div class="flex">
                        <span class="inline-flex items-center px-3 rounded-l-xl border border-r-0 border-stone-700 bg-stone-800 text-sm text-stone-300 font-medium">
                            🇦🇴 +244
                        </span>
                        <input type="tel" placeholder="9XX XXX XXX" 
                               class="w-full bg-stone-800/80 border border-stone-700 rounded-r-xl px-4 py-3 text-sm text-white placeholder-stone-500 focus:outline-none focus:border-amber-500 transition-colors">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-400 uppercase tracking-wider mb-1.5">Palavra-passe</label>
                    <input type="password" placeholder="••••••••" 
                           class="w-full bg-stone-800/80 border border-stone-700 rounded-xl px-4 py-3 text-sm text-white placeholder-stone-500 focus:outline-none focus:border-amber-500 transition-colors">
                </div>

                <!-- Botão de Ação -->
                <button type="submit" 
                        class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-stone-950 font-bold uppercase tracking-wider py-3.5 px-4 rounded-xl shadow-lg shadow-amber-500/20 active:scale-[0.99] transition-all text-sm mt-2">
                    🎰 Criar Conta e Ativar Jogadas
                </button>
            </form>
        </div>

        <!-- Rodapé do Card -->
        <div class="mt-6 pt-4 border-t border-stone-800/60 text-center">
            <p class="text-[10px] text-stone-500 tracking-wide">
                Oferta por tempo limitado. Jogue com responsabilidade.
            </p>
        </div>
    </div>

</body>
</html>
